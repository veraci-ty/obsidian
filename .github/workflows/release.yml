name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Rojo
        uses: rojo-rbx/setup-rojo@v1
        
      - name: Build .rbxm
        run: |
          rojo build -o Obsidian-${{ github.ref_name }}.rbxm default.project.json
          
      - name: Create source zip
        run: |
          cd src/ReplicatedStorage/Packages
          zip -r ../../../obsidian-${{ github.ref_name }}-source.zip Obsidian
          cd ../../..
          
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Obsidian-${{ github.ref_name }}.rbxm
            obsidian-${{ github.ref_name }}-source.zip
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
